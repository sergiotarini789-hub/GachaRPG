name: Unity Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: unity-build
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Unity Project
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Find Unity
        shell: powershell
        run: |
          $unity = Get-ChildItem "C:\Program Files\Unity\Hub\Editor" `
            -Filter "Unity.exe" `
            -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $unity) {
            Write-Error "Unity.exe not found"
            exit 1
          }

          "UNITY_PATH=$($unity.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using Unity: $($unity.FullName)"

      - name: Validate Project
        shell: powershell
        run: |
          $logFile = "$env:GITHUB_WORKSPACE\Build\unity-validation.log"

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Build" | Out-Null

          Write-Host "Starting Unity validation..."
          Write-Host "Library is intentionally preserved for faster subsequent runs."

          $args = @(
            "-batchmode"
            "-nographics"
            "-quit"
            "-projectPath"
            "$env:GITHUB_WORKSPACE"
            "-logFile"
            "$logFile"
          )

          $proc = Start-Process `
            -FilePath "$env:UNITY_PATH" `
            -ArgumentList $args `
            -Wait `
            -PassThru `
            -NoNewWindow

          $exitCode = $proc.ExitCode

          Write-Host "Unity validation exit code: $exitCode"

          if (Test-Path $logFile) {
            Write-Host "===== UNITY VALIDATION LOG ====="
            Get-Content $logFile
            Write-Host "===== END UNITY VALIDATION LOG ====="
          }

          if ($exitCode -ne 0) {
            throw "Unity validation failed with exit code $exitCode"
          }

  build:
    name: Build Windows x64
    runs-on: self-hosted

    # Full build only when manually started.
    # This prevents every AI commit from taking 20-25 minutes.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Find Unity
        shell: powershell
        run: |
          $unity = Get-ChildItem "C:\Program Files\Unity\Hub\Editor" `
            -Filter "Unity.exe" `
            -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $unity) {
            Write-Error "Unity.exe not found"
            exit 1
          }

          "UNITY_PATH=$($unity.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using Unity: $($unity.FullName)"

      - name: Build Windows
        shell: powershell
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\Build\Windows"
          $logFile = "$env:GITHUB_WORKSPACE\Build\unity-build.log"
          $exePath = "$buildDir\GachaRPG.exe"

          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          Write-Host "Starting Windows x64 build..."
          Write-Host "Using existing Unity Library cache."

          $args = @(
            "-batchmode"
            "-nographics"
            "-quit"
            "-projectPath"
            "$env:GITHUB_WORKSPACE"
            "-buildTarget"
            "Win64"
            "-buildWindows64Player"
            "$exePath"
            "-logFile"
            "$logFile"
          )

          $proc = Start-Process `
            -FilePath "$env:UNITY_PATH" `
            -ArgumentList $args `
            -Wait `
            -PassThru `
            -NoNewWindow

          $exitCode = $proc.ExitCode

          Write-Host "Unity build exit code: $exitCode"

          if (Test-Path $logFile) {
            Write-Host "===== UNITY BUILD LOG ====="
            Get-Content $logFile
            Write-Host "===== END UNITY BUILD LOG ====="
          }

          if ($exitCode -ne 0) {
            throw "Unity build failed with exit code $exitCode"
          }

          if (-not (Test-Path $exePath)) {
            throw "Build completed but GachaRPG.exe was not found."
          }

          Write-Host "Windows build successfully created:"
          Write-Host $exePath

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: GachaRPG-Windows-x64-build
          path: Build/Windows/
          if-no-files-found: error
