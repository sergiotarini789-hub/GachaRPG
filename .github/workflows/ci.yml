# Fast CI for GachaRPG - runs on every push to main.
#
# Deliberately NEVER launches Unity: a cold Unity import costs 15+ minutes
# and the AI development loop must stay fast. Instead this workflow checks,
# in a few seconds:
#
#   1. Git integrity - the checkout matches the pushed commit, the object
#      database is healthy (git fsck), and no merge-conflict markers are
#      left in any tracked file.
#   2. Project structure - ProjectVersion.txt pins the Unity version and
#      that exact editor is installed on the runner, settings and package
#      manifests parse, every scene referenced by the Build Settings
#      exists, and Unity YAML files carry proper headers.
#   3. Unity meta files - every asset and folder under Assets/ has its
#      .meta committed, every .meta carries a GUID, all GUIDs are unique,
#      and scene files contain no duplicate object ids.
#   4. C# script sanity - every script is ASCII-only and structurally
#      balanced (braces/parentheses/brackets, counting outside strings,
#      verbatim strings, char literals and comments).
#
# Full Unity validation and the Windows x64 player build live in
# build.yml and run manually via workflow_dispatch.

name: Fast CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes the previous check. Nothing stateful runs here
# (no Unity, no shared caches), so cancelling an in-progress fast check is
# always safe and keeps the loop responsive.
concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast project checks (no Unity import)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      # ----------------------------------------------------------------
      # Checkout - clean:false keeps the Unity Library folder in the
      # workspace so the manual full-build workflow stays fast.
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: false

      # ----------------------------------------------------------------
      # 1) Git integrity.
      # ----------------------------------------------------------------
      - name: Check Git integrity
        id: git
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # The checkout must be exactly the commit that was pushed.
          $head = (git rev-parse HEAD | Select-Object -First 1).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            Write-Output "::error::Checkout integrity failed: HEAD is $head but the workflow runs for $($env:GITHUB_SHA)"
            exit 1
          }
          Write-Output "Checked out commit: $head"

          # Object database health.
          git fsck --no-dangling
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::git fsck reported repository corruption (exit code $LASTEXITCODE)"
            exit 1
          }
          Write-Output 'git fsck: object database OK'

          # No merge-conflict markers anywhere in tracked files.
          git grep -n -E '^(<{7} |>{7} |={7}$)' -- .
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0) {
            Write-Output '::error::Merge conflict markers found in tracked files (see the list above)'
            exit 1
          }
          if ($grepExit -gt 1) {
            Write-Output "::error::git grep failed with exit code $grepExit"
            exit 1
          }
          Write-Output 'No merge conflict markers in tracked files'

          # Informational only: leftovers from earlier jobs (the Unity
          # Library and Build outputs are git-ignored and expected).
          $untracked = @(git status --porcelain)
          if ($untracked.Count -gt 0) {
            Write-Output "Note: $($untracked.Count) untracked or modified entries in the workspace (tracked files are always reset by checkout):"
            foreach ($u in $untracked) { Write-Output "  $u" }
          } else {
            Write-Output 'Workspace clean (no untracked, non-ignored files)'
          }
          exit 0

      # ----------------------------------------------------------------
      # 2) Unity project structure (files only - Unity is never launched).
      # ----------------------------------------------------------------
      - name: Check Unity project structure
        id: structure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = $env:GITHUB_WORKSPACE
          $assetsRoot = Join-Path $project 'Assets'

          # --- Unity version pinned by the project ---
          $versionFile = Join-Path $project 'ProjectSettings\ProjectVersion.txt'
          if (-not (Test-Path $versionFile)) {
            Write-Output "::error::Unity project not detected - ProjectSettings\ProjectVersion.txt is missing from $project"
            exit 1
          }
          $versionLine = Get-Content $versionFile |
            Where-Object { $_ -like 'm_EditorVersion:*' } |
            Select-Object -First 1
          if (-not $versionLine) {
            Write-Output '::error::ProjectVersion.txt contains no m_EditorVersion line - the Unity version cannot be determined'
            exit 1
          }
          $unityVersion = ($versionLine -replace '^\s*m_EditorVersion:\s*', '').Trim()
          Write-Output "Unity version required by the project: $unityVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "UNITY_VERSION=$unityVersion"

          # --- the exact editor must be installed for the full build ---
          $candidates = @()
          if ($env:UNITY_EDITOR_PATH) {
            $override = $env:UNITY_EDITOR_PATH
            if (Test-Path $override -PathType Container) {
              $override = Join-Path $override 'Unity.exe'
            }
            $candidates += $override
          }
          $hubRoots = @()
          if ($env:ProgramFiles) { $hubRoots += $env:ProgramFiles }
          if (${env:ProgramFiles(x86)}) { $hubRoots += ${env:ProgramFiles(x86)} }
          if ($env:LOCALAPPDATA) { $hubRoots += $env:LOCALAPPDATA }
          $candidates += @($hubRoots | ForEach-Object {
            Join-Path $_ "Unity\Hub\Editor\$unityVersion\Editor\Unity.exe"
          })
          $candidates += Join-Path $env:ProgramFiles "Unity $unityVersion\Editor\Unity.exe"

          $unityExe = @($candidates | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }) |
            Select-Object -First 1
          if (-not $unityExe) {
            $searched = ($candidates | Where-Object { $_ }) -join ' | '
            Write-Output "::error::Unity $unityVersion is not installed on this runner (searched: $searched). The manual full-build workflow would fail - install it with Unity Hub or set UNITY_EDITOR_PATH."
            exit 1
          }
          Write-Output "Unity editor available for full builds: $unityExe"

          # --- settings and packages parse ---
          $settingsFile = Join-Path $project 'ProjectSettings\ProjectSettings.asset'
          $ebsFile = Join-Path $project 'ProjectSettings\EditorBuildSettings.asset'
          foreach ($f in @($settingsFile, $ebsFile)) {
            if (-not (Test-Path $f)) {
              Write-Output "::error::Required project file is missing: $f"
              exit 1
            }
          }
          $nameLine = Get-Content $settingsFile |
            Where-Object { $_ -match '^\s*productName:' } |
            Select-Object -First 1
          if (-not $nameLine -or [string]::IsNullOrWhiteSpace(($nameLine -replace '^\s*productName:\s*', ''))) {
            Write-Output '::error::productName is empty or missing in ProjectSettings.asset'
            exit 1
          }

          try {
            $manifest = Get-Content (Join-Path $project 'Packages\manifest.json') -Raw | ConvertFrom-Json
          } catch {
            Write-Output "::error::Packages\manifest.json is not valid JSON: $_"
            exit 1
          }
          $packageCount = ($manifest.dependencies.PSObject.Properties | Measure-Object).Count
          Write-Output "Packages/manifest.json OK ($packageCount dependencies)"

          $lockFile = Join-Path $project 'Packages\packages-lock.json'
          if (Test-Path $lockFile) {
            try {
              Get-Content $lockFile -Raw | ConvertFrom-Json | Out-Null
              Write-Output 'Packages/packages-lock.json OK'
            } catch {
              Write-Output "::error::Packages\packages-lock.json is not valid JSON: $_"
              exit 1
            }
          }

          # --- every scene in the Build Settings must exist ---
          $scenes = @(Select-String -Path $ebsFile -Pattern '^\s*path:\s*(Assets/.+\.unity)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          if ($scenes.Count -eq 0) {
            Write-Output '::error::No scenes are configured in EditorBuildSettings.asset - a player build would produce an empty game'
            exit 1
          }
          $missingScenes = @($scenes | Where-Object { -not (Test-Path (Join-Path $project $_)) })
          if ($missingScenes.Count -gt 0) {
            Write-Output "::error::Scenes referenced by the Build Settings are missing from the repository: $($missingScenes -join ', ')"
            exit 1
          }
          Write-Output "Build Settings scene(s) present: $($scenes -join ', ')"
          Add-Content -Path $env:GITHUB_ENV -Value "SCENE_COUNT=$($scenes.Count)"

          # --- Unity YAML files must carry the YAML header ---
          # (.inputactions and ProjectSettings/XRSettings.asset are JSON by
          # design and are not checked)
          $yamlFiles = @(Get-ChildItem -Path $assetsRoot -Recurse -Include *.unity, *.asset, *.prefab, *.mat, *.controller, *.anim)
          $yamlFiles += @(Get-ChildItem -Path (Join-Path $project 'ProjectSettings') -Filter '*.asset' |
            Where-Object { $_.Name -ne 'XRSettings.asset' })
          $badHeaders = @()
          foreach ($f in $yamlFiles) {
            $first = @(Get-Content -LiteralPath $f.FullName -TotalCount 2)
            if ($first.Count -lt 2 -or $first[0] -ne '%YAML 1.1' -or -not $first[1].StartsWith('%TAG !u!')) {
              $badHeaders += $f.FullName
            }
          }
          if ($badHeaders.Count -gt 0) {
            Write-Output "::error::Unity YAML files with a broken header (expected '%YAML 1.1' + '%TAG !u!'): $($badHeaders -join ', ')"
            exit 1
          }
          Write-Output "Unity YAML headers OK ($($yamlFiles.Count) files)"
          exit 0

      # ----------------------------------------------------------------
      # 3) Unity meta files and GUIDs.
      # ----------------------------------------------------------------
      - name: Check Unity meta files and GUIDs
        id: meta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = $env:GITHUB_WORKSPACE
          $assetsRoot = Join-Path $project 'Assets'

          # Every file and folder under Assets must have its .meta committed.
          $missingMetas = @()
          $entries = @(Get-ChildItem -LiteralPath $assetsRoot -Recurse)
          foreach ($e in $entries) {
            if (-not (Test-Path -LiteralPath "$($e.FullName).meta")) {
              $missingMetas += $e.FullName
            }
          }
          if ($missingMetas.Count -gt 0) {
            $list = ($missingMetas | Select-Object -First 10) -join ', '
            Write-Output "::error::Unity assets without a committed .meta file ($($missingMetas.Count) total, showing up to 10): $list. Add the missing .meta files - otherwise Unity regenerates them with new GUIDs on every machine."
            exit 1
          }

          # Advisory: the project-root Assets.meta is not tracked in this
          # repository; Unity regenerates it locally, so this is a note,
          # not a failure.
          if (-not (Test-Path (Join-Path $project 'Assets.meta'))) {
            Write-Output 'Note: Assets.meta is not committed (Unity regenerates it locally) - advisory only.'
          }

          # Every .meta carries a GUID and all GUIDs are unique.
          $metas = @(Get-ChildItem -LiteralPath $assetsRoot -Recurse -Filter '*.meta')
          $guidMap = @{}
          $dupes = @()
          $noGuid = @()
          foreach ($m in $metas) {
            $g = Select-String -LiteralPath $m.FullName -Pattern '^guid: ([0-9a-f]{32})\s*$' |
              Select-Object -First 1
            if (-not $g) {
              $noGuid += $m.FullName
              continue
            }
            $guid = $g.Matches[0].Groups[1].Value
            if ($guidMap.ContainsKey($guid)) {
              $dupes += "$($m.FullName) duplicates $($guidMap[$guid]) (guid $guid)"
            } else {
              $guidMap[$guid] = $m.FullName
            }
          }
          if ($noGuid.Count -gt 0) {
            Write-Output "::error::.meta files without a valid guid line: $($noGuid -join ', ')"
            exit 1
          }
          if ($dupes.Count -gt 0) {
            Write-Output "::error::Duplicate Unity GUIDs found (this silently breaks asset references): $($dupes -join ' | ')"
            exit 1
          }
          Write-Output "Meta files OK: $($metas.Count) metas, $($guidMap.Count) unique GUIDs"
          Add-Content -Path $env:GITHUB_ENV -Value "META_COUNT=$($metas.Count)"

          # Scene files must not contain duplicate object ids (a classic
          # hand-editing accident that breaks scene loading).
          $sceneFiles = @(Get-ChildItem -LiteralPath $assetsRoot -Recurse -Filter '*.unity')
          foreach ($sf in $sceneFiles) {
            $ids = @(Select-String -LiteralPath $sf.FullName -Pattern '^--- !u!\d+ &(\d+)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value })
            $unique = @($ids | Select-Object -Unique)
            if ($unique.Count -ne $ids.Count) {
              Write-Output "::error::Duplicate object ids inside $($sf.FullName) - the scene YAML is corrupt"
              exit 1
            }
          }
          Write-Output "Scene object ids OK ($($sceneFiles.Count) scene files)"
          exit 0

      # ----------------------------------------------------------------
      # 4) C# script sanity (structural - not a compiler).
      # ----------------------------------------------------------------
      - name: Check C# script sanity
        id: scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = $env:GITHUB_WORKSPACE

          # Strips regular strings, verbatim strings, char literals, line
          # comments and block comments before counting delimiters, so
          # braces inside text never cause false failures.
          $pattern = '(?s)@"(?:""|[^"])*"|"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*''|//[^\n]*|/\*.*?\*/'

          $scripts = @(Get-ChildItem -LiteralPath (Join-Path $project 'Assets') -Recurse -Filter '*.cs')
          $badAscii = @()
          $unbalanced = @()
          foreach ($s in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($s.FullName)
            if (@($bytes -gt 127).Count -gt 0) {
              $badAscii += $s.FullName
              continue
            }
            $text = [System.IO.File]::ReadAllText($s.FullName)
            $stripped = [regex]::Replace($text, $pattern, '')
            $pairs = @(@('{', '}'), @('(', ')'), @('[', ']'))
            foreach ($p in $pairs) {
              $o = [regex]::Matches($stripped, [regex]::Escape($p[0])).Count
              $c = [regex]::Matches($stripped, [regex]::Escape($p[1])).Count
              if ($o -ne $c) {
                $unbalanced += "$($s.FullName): '$($p[0])'=$o '$($p[1])'=$c"
                break
              }
            }
          }
          if ($badAscii.Count -gt 0) {
            Write-Output "::error::C# files contain non-ASCII characters (repository convention is ASCII-only): $($badAscii -join ', ')"
            exit 1
          }
          if ($unbalanced.Count -gt 0) {
            Write-Output "::error::C# files with unbalanced braces/parentheses/brackets (strings and comments excluded): $($unbalanced -join ' | ')"
            exit 1
          }
          Write-Output "C# scripts OK: $($scripts.Count) files, ASCII-only and structurally balanced"
          Add-Content -Path $env:GITHUB_ENV -Value "SCRIPT_COUNT=$($scripts.Count)"
          exit 0

      # ----------------------------------------------------------------
      # 5) Report.
      # ----------------------------------------------------------------
      - name: Report
        if: success()
        shell: powershell
        run: |
          $summaryLines = @(
            '## Fast CI - passed',
            '',
            "- Commit: $($env:GITHUB_SHA)",
            "- Git integrity: HEAD matches the push, fsck clean, no conflict markers",
            "- Project structure: Unity $($env:UNITY_VERSION) project intact, exact editor installed, packages and scenes resolve",
            "- Meta files: $($env:META_COUNT) metas committed, all GUIDs unique",
            "- Scripts: $($env:SCRIPT_COUNT) C# files ASCII-clean and structurally balanced",
            '',
            'No Unity import was launched. For full validation and the Windows x64 build, run the **Unity Build** workflow manually.'
          )
          $summaryLines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Output '::notice::Fast CI passed - the project checks out cleanly without launching Unity.'

      - name: Report failed checks
        if: ${{ !success() }}
        shell: powershell
        env:
          GIT_OUTCOME: ${{ steps.git.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          META_OUTCOME: ${{ steps.meta.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output 'Fast CI failed. Failed check(s):'
          foreach ($s in @(
            @{ Label = 'Git integrity';        Outcome = $env:GIT_OUTCOME },
            @{ Label = 'Project structure';    Outcome = $env:STRUCTURE_OUTCOME },
            @{ Label = 'Meta files and GUIDs'; Outcome = $env:META_OUTCOME },
            @{ Label = 'C# script sanity';     Outcome = $env:SCRIPTS_OUTCOME }
          )) {
            if ($s.Outcome -eq 'failure') {
              Write-Output " - $($s.Label)"
            }
          }
          Write-Output 'The exact error is printed in the failed step above.'
